services:
  postgres:
    image: postgres:16-alpine
    container_name: grabseat-postgres
    environment:
      POSTGRES_DB: grabseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - grabseat-pgdata:/var/lib/postgresql/data

volumes:
  grabseat-pgdata:
