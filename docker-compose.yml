services:
  postgres:
    image: postgres:16-alpine
    container_name: grabseat-postgres
    environment:
      POSTGRES_DB: grabseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - grabseat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grabseat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: grabseat-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grabseat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  grabseat-pgdata:
