services:
  postgres:
    image: postgres:16-alpine
    container_name: grabseat-postgres
    environment:
      POSTGRES_DB: grabseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - grabseat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grabseat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: grabseat-app
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grabseat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "8080:8080"

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: grabseat-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - grabseat-esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./frontend
    container_name: grabseat-web
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  grabseat-pgdata:
  grabseat-esdata:
