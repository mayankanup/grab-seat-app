server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Never cache the SPA shell: a stale index.html pins an old JS bundle.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /auth/ {
    proxy_pass http://app:8080;
  }
  location /events/ {
    proxy_pass http://app:8080;
  }
  location /bookings/ {
    proxy_pass http://app:8080;
  }
  location /admin/ {
    proxy_pass http://app:8080;
  }
  location /users/ {
    proxy_pass http://app:8080;
  }
  location /api/ {
    proxy_pass http://app:8080;
  }
  location = /auth {
    proxy_pass http://app:8080;
  }
  location = /events {
    proxy_pass http://app:8080;
  }
  location = /bookings {
    proxy_pass http://app:8080;
  }
  location = /admin {
    proxy_pass http://app:8080;
  }
  location = /users {
    proxy_pass http://app:8080;
  }
}
