server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Never cache the SPA shell: a stale index.html pins an old JS bundle.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # All backend APIs live under /api (SPA routes never collide with it).
  location /api/ {
    proxy_pass http://app:8080;
  }
}
