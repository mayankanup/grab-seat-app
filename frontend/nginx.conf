server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /auth/ {
    proxy_pass http://app:8080;
  }
  location /events/ {
    proxy_pass http://app:8080;
  }
  location /bookings/ {
    proxy_pass http://app:8080;
  }
  location /api/ {
    proxy_pass http://app:8080;
  }
  location = /auth {
    proxy_pass http://app:8080;
  }
  location = /events {
    proxy_pass http://app:8080;
  }
  location = /bookings {
    proxy_pass http://app:8080;
  }
}
