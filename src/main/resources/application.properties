spring.application.name=grab-seat-app
server.port=8080

# PostgreSQL - local dev (see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/grabseat
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT (dev defaults; override JWT_SECRET in real environments)
jwt.secret=${JWT_SECRET:grabseat-dev-secret-change-me-in-prod-32}
jwt.expiration-ms=3600000

# Elasticsearch (override SPRING_ELASTICSEARCH_URIS in Docker)
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
spring.data.elasticsearch.repositories.enabled=true

# Kafka CDC source (Debezium Server -> dbserver1.public.events)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=grabseat-search-indexer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
